spring:
  application:
    name: api-service

  datasource:
    url: jdbc:postgresql://localhost:5432/poe_pricer
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

poe:
  trade:
    enabled: ${POE_TRADE_ENABLED:false}
    base-url: ${POE_TRADE_BASE_URL:https://www.pathofexile.com}
    user-agent: ${POE_USER_AGENT}
    max-fetch-size: ${POE_TRADE_MAX_FETCH_SIZE:10}
